name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.14.0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Zig version
        run: zig version

      - name: Check Python version
        run: python --version

      - name: Build project
        run: zig build

      - name: Run simple test first
        run: |
          echo "Running simple test..."
          zig test tests/tools_test.zig 2>&1 || echo "Simple test completed"

      - name: Run all unit tests
        shell: bash
        run: |
          echo "Running all tests..."
          zig build test-all --summary all 2>&1

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Format check
        run: zig fmt --check src/ tests/