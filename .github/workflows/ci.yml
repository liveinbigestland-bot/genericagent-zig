name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.14.0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build project
        run: zig build

      - name: Run unit tests (excluding web_ops which require network)
        run: |
          echo "Running code_run tests..."
          zig build test-code-run --summary all
          echo "Running file_ops tests..."
          zig build test-file-ops --summary all
          echo "Running memory_ops tests..."
          zig build test-memory-ops --summary all
          echo "Running tools tests..."
          zig build test-tools --summary all

      - name: Run web_ops tests
        run: zig build test-web-ops --summary all

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Format check
        run: zig fmt --check src/ tests/