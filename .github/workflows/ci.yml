name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  ZIG_VERSION: 0.14.0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build project (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "=== Building project ==="
          zig build 2>&1 | Tee-Object -FilePath build.log
          $BUILD_EXIT_CODE = $LASTEXITCODE
          echo "Build exit code: $BUILD_EXIT_CODE"
          if ($BUILD_EXIT_CODE -ne 0) {
            echo "::error::Build failed with exit code $BUILD_EXIT_CODE"
          }
          exit $BUILD_EXIT_CODE

      - name: Build project (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          echo "=== Building project ==="
          set -o pipefail
          zig build 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT_CODE"
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT_CODE"
          fi
          exit $BUILD_EXIT_CODE

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          retention-days: 30

      - name: Run all unit tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "=== Running all unit tests ==="
          zig build test-all 2>&1 | Tee-Object -FilePath test.log
          $TEST_EXIT_CODE = $LASTEXITCODE
          echo "Test exit code: $TEST_EXIT_CODE"
          if ($TEST_EXIT_CODE -ne 0) {
            echo "::error::Tests failed with exit code $TEST_EXIT_CODE"
          }
          exit $TEST_EXIT_CODE

      - name: Run all unit tests (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          echo "=== Running all unit tests ==="
          set -o pipefail
          zig build test-all 2>&1 | tee test.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "Test exit code: $TEST_EXIT_CODE"
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "::error::Tests failed with exit code $TEST_EXIT_CODE"
          fi
          exit $TEST_EXIT_CODE

      - name: Upload test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
          retention-days: 30

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Format check
        run: zig fmt --check src/ tests/